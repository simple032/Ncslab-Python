# Optional: only if you add a dedicated nginx location. When nginx cannot be changed, use the same
# URL as normal simulation (/matlab/websocketsimulate → .../websocketsimulate) and send JSON field
# "preferCudaSimulation": true on the start message (see websocket-api.yaml / WebSocketMessageDto).

location /matlab/websocketsimulatecuda {
    proxy_pass http://localhost:8060/NCSLabLink/websocketsimulatecuda;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
}
