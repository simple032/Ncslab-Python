# Simulation Accuracy Enhancement Configuration
# Controls accuracy-enhanced simulation features
accuracy.enabled=true
accuracy.default.level=ENHANCED
accuracy.algebraic.loop.detection=true
accuracy.numerical.stability.management=true
accuracy.nonlinear.convergence=true
accuracy.realtime.execution.bounds=true
accuracy.performance.monitoring=true

# Accuracy Level Configuration Options:
# STANDARD - Basic accuracy with fixed-point iteration
# ENHANCED - Newton-Raphson with adaptive step sizing (default)
# PRECISION - Trust region method with high precision tolerances  
# REAL_TIME - Fixed-point with bounded execution time

# Accuracy tolerances and limits
# Convergence tolerance for algebraic loop resolution (1e-8 = 0.00000001)
# Lower values = higher precision but slower convergence
# Typical range: 1e-6 (fast) to 1e-10 (precise)
accuracy.algebraic.loop.tolerance=1e-8

# Numerical stability tolerance for general calculations (1e-8 = 0.00000001)
# Used for zero-crossing detection, state updates, and numerical derivatives
# Must match or be stricter than algebraic loop tolerance
accuracy.numerical.tolerance=1e-8

# Maximum iterations for iterative solvers (Newton-Raphson, fixed-point)
# Prevents infinite loops in non-convergent systems
# Typical range: 50 (fast systems) to 500 (complex algebraic loops)
accuracy.max.iterations=100

# Real-time execution timeout in milliseconds (1000ms = 1 second)
# Maximum time allowed for a single simulation step in real-time mode
# Prevents blocking when solving complex algebraic loops
# Increase for complex models, decrease for strict real-time requirements
accuracy.realtime.max.execution.ms=1000

# Error recovery and fallback options
accuracy.error.recovery.enabled=true
accuracy.fallback.to.standard=true